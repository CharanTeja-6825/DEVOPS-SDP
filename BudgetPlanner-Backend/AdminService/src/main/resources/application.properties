spring.application.name=AdminService
server.port=1431

# DB Configuration

# ----> MySQL Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/budgetplanner
spring.datasource.username=root
spring.datasource.password=Charan@825
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ----> JPA & Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect


# Microservice Configuration

# ----> Eureka Domain and Application Name Configuration
eureka.instance.appname=adminservice
eureka.instance.hostname=localhost


# ----> Eureka Client Configuration
eureka.client.fetch-registry=true
eureka.client.register-with-eureka=true

# ----> Actuator Configuration
management.info.env.enabled=true
management.endpoints.web.exposure.include=*
