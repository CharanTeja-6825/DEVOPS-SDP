spring.application.name=BudgetPlanner
server.port=1432

# === MySQL DB Configuration ===
spring.datasource.url=jdbc:mysql://localhost:3306/budgetplanner
spring.datasource.username=root
spring.datasource.password=Charan@825
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# === JPA & Hibernate ===
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# === Logging (Optional for Debugging SQL) ===
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# Eureka Configuration #
eureka.instance.hostname=localhost
eureka.instance.appname=userservice
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

# Actuator Configuration #
management.info.env.enabled=true
management.endpoints.web.exposure.include=*
